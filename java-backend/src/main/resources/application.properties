server.port=5000

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/military_assets?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Ambu@2004

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=true

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# H2 disabled
spring.h2.console.enabled=false

logging.level.com.military=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=spring.log
